<!DOCTYPE html>
<html lang="en">
   <link rel="icon" href="images/X trans.png" type="image/png">
<head>
    <meta charset="UTF-8">
    <title>Payment Cancelled</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #000000;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

.btn {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #000000;
    background-color: #ffffff;
    border: 2px solid #000000; /* Proper border */
    border-radius: 30px;
    text-decoration: none;
    transition: background-color 0.3s ease;
}

.btn:hover {
    background-color: #000000;
    color: #ffffff;
}

    </style>
</head>
<body>

<div class="container">
    <h1>Payment Cancelled</h1>
    <p>It looks like your payment didn’t go through. If this was a mistake or you changed your mind, you can try again below.</p>
    <p>If you chose to cancel, we're sorry to see you go — but we hope to connect with you again in the future.</p>
    <a href="index.html" class="btn">Return to Home</a>
</div>

</html>
