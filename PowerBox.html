<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Banner</title>
  <link rel="stylesheet" href="powerbox.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">BrandName</div>
    <ul class="nav-links">
      <li><a href="#intro">Home</a></li>
      <li><a href="#info">Info</a></li>
      <li><a href="#offers">Offers</a></li>
      <li><a href="#book">Book</a></li>
    </ul>
  </nav>

  <!-- BANNER -->
  <section class="banner" id="intro">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <h1>Your Main Message</h1>
      <p>Short, clear description goes here.</p>
      <button>Get Started</button>
    </div>
  </section>

  <section class="cards-section" id="info">

    <div class="cube-card">
      <div class="cube">
        <div class="face face-front">Power Box</div>
        <div class="face face-right">One</div>
        <div class="face face-back">Info for box one</div>
      </div>
    </div>

    <div class="cube-card">
      <div class="cube">
        <div class="face face-front">Power Box</div>
        <div class="face face-right">Two</div>
        <div class="face face-back">Info for box two</div>
      </div>
    </div>

    <div class="cube-card">
      <div class="cube">
        <div class="face face-front">Power Box</div>
        <div class="face face-right">Three</div>
        <div class="face face-back">Info for box three</div>
      </div>
    </div>

    <div class="cube-card">
      <div class="cube">
        <div class="face face-front">Power Box</div>
        <div class="face face-right">Four</div>
        <div class="face face-back">Info for box four</div>
      </div>
    </div>

  </div>
</section>

  </div>
</section>

</html>
